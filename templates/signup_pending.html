<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup Pending - PhishGuard AI</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

<style>
body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.18), transparent 28%),
        radial-gradient(circle at bottom right, rgba(217, 119, 6, 0.16), transparent 24%),
        #f8fafc;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
    color: #0f172a;
}

.pending-card {
    width: min(440px, calc(100% - 32px));
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid rgba(148, 163, 184, 0.22);
    border-radius: 24px;
    padding: 34px;
    box-shadow: 0 18px 44px rgba(15, 23, 42, 0.12);
    text-align: center;
}

.pending-icon {
    width: 68px;
    height: 68px;
    border-radius: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: rgba(217, 119, 6, 0.14);
    color: #d97706;
    font-size: 1.8rem;
    margin-bottom: 18px;
}

.pending-title {
    font-weight: 700;
    margin-bottom: 10px;
}

.pending-text {
    color: #64748b;
    margin-bottom: 24px;
}
</style>
</head>

<body>
    <main class="pending-card">
        <div class="pending-icon">
            <i class="bi bi-hourglass-split"></i>
        </div>
        <h1 class="pending-title h3">Your signup request is pending admin approval</h1>
        <p class="pending-text">You will be able to log in after an admin approves your account.</p>
        <a href="{{ url_for('user_login') }}" class="btn btn-primary rounded-pill px-4">
            Back to Login
        </a>
    </main>
</body>
</html>
